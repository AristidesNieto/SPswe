[project]
name = "uavtracker"
version = "0.0.2"
description = "Simple UAV path planing tool GEN-AI made"
readme = "README.md"
authors = [
    { name = "Dejan Šeatović", email = "dejan.seatovic@ost.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.17.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.1.2",
]

[project.scripts]
uavtracker = "uavtracker:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
