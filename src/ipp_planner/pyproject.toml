[project]
name = "ipp_planner"
version = "0.1.0"
description = "Simple robot path planing and monitoring tool"
readme = "README.md"
authors = [
    { name = "Dejan Šeatović", email = "dejan.seatovic@ost.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "nicegui>=3.17.1",
    "pydantic>=2.13.5",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "rio-tiler>=9.4.9",
    "shapely>=2.1.2",
    "simplekml>=1.3.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
ipp_planner = "ipp_planner:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
